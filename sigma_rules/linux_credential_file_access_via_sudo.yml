title: Sensitive Credential File Read via sudo
id: a1111111-0002-4001-8001-000000000002
status: stable
description: >
  Detects use of sudo to directly read /etc/shadow or /etc/passwd, which is
  frequently observed during OS credential dumping activity.
author: SOCShield
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Process: sudo
  selection_sensitive_file:
    Command|contains:
      - /etc/shadow
      - /etc/passwd
  condition: selection and selection_sensitive_file
level: critical
tags:
  - attack.credential_access
  - attack.t1003
